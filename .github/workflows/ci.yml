name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade aiohttp Pillow numpy pytest

      - name: Compile backend
        run: python -m compileall -q lora_dataset

      - name: Run tests
        run: python -m pytest -q

      - name: Validate App workflow JSON
        run: python -m json.tool "example_workflows/LoRA Dataset Builder.app.json" > /dev/null
